# matugen : lance par wayle (theme-provider = "matugen") sur le fond d ecran.
# pas de section [config.wallpaper] : c est wayle + awww qui posent le fond.
[config]

# couleurs des bordures hyprland
[templates.hyprland]
input_path = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.config/hypr/matugen-colors.lua"
# applique aussi les couleurs tout de suite, sans reconnexion (hyprctl eval = lua en direct).
# chemin absolu : matugen lance le hook avec $SHELL (nushell), le PATH n est pas garanti.
post_hook = "/run/current-system/sw/bin/apply-hypr-colors"


# couleurs de rofi (lanceur d applis) : relu a chaque ouverture, rien a relancer
[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/matugen-colors.rasi"
