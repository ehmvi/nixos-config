# hypridle : verrouillage auto + avant la veille
general {
    lock_cmd = pidof hyprlock || hyprlock                             # un seul hyprlock à la fois
    before_sleep_cmd = loginctl lock-session                          # verrouille avant la veille (capot fermé)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # rallume l'écran au réveil
}

# 4 min 30 : ecran assombri a 10 %, luminosite restauree a la reprise.
# -c backlight : sur games, brightnessctl liste d'abord les leds du clavier.
# navi : l'ecran baisse. games : /sys/class/backlight est vide, la
# condition echoue et hypridle saute aussi on-resume.
listener {
    timeout = 270
    condition_cmd = ls /sys/class/backlight/* >/dev/null 2>&1
    on-timeout = brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -c backlight -r
}

# 5 min sans activité : verrouillage
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5 min 30 : écran éteint (dpms), rallumé au moindre mouvement
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 10 min : mise en veille, seulement sur batterie. systemd-ac-power sort
# en 0 sur secteur. navi : veille sur batterie, rien sur secteur. games :
# pas de batterie, toujours sur secteur, donc jamais de veille.
# condition_retry : si le portable est debranche apres les 10 min sans
# reprise d'activite, la veille part dans la minute.
listener {
    timeout = 600
    condition_cmd = ! systemd-ac-power
    condition_retry = 60
    on-timeout = systemctl suspend
}
