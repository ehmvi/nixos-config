[bar]
scale = 0.800000011920929
inset-edge = 0.10000000149011612
inset-ends = 0.550000011920929
padding = 0.4000000059604645
padding-ends = 0.0
bg = "bg-base"
background-opacity = 95
border-location = "all"
border-width = 2
border-color = "bg-overlay"
button-rounding = "none"
button-gap = 0.25
button-group-rounding = "none"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
]
center = ["clock"]
right = [
    "cpu",
    "ram",
    "volume",
    "network",
    "battery",
    "systray",
    "notifications",
]

[modules.battery]
border-show = true
border-color = "accent"
icon-bg-color = "accent"
icon-color = "bg-base"
label-color = "accent"
button-bg-color = "bg-base"

[modules.clock]
border-show = true
border-color = "accent"
icon-color = "bg-base"
icon-bg-color = "accent"
label-color = "accent"
button-bg-color = "bg-base"
dropdown-show-seconds = true

[modules.cpu]
poll-interval-ms = 5000
border-show = true
border-color = "accent"
icon-color = "bg-base"
icon-bg-color = "accent"
label-color = "accent"
button-bg-color = "bg-base"

[modules.dashboard]
border-show = true
border-color = "border-accent"
icon-color = "accent"
icon-bg-color = "bg-base"

[modules.hyprland-workspaces]
min-workspace-count = 3
active-indicator = "underline"
active-color = "accent"
occupied-color = "fg-muted"
container-bg-color = "bg-base"
border-show = true
border-color = "fg-muted"

[modules.network]
border-show = true
border-color = "accent"
icon-bg-color = "accent"
label-color = "accent"
button-bg-color = "bg-base"

[modules.notification]
border-show = true
border-color = "status-info"
icon-color = "bg-base"
icon-bg-color = "status-info"
label-color = "status-info"
button-bg-color = "bg-base"

[modules.ram]
border-show = true
border-color = "accent"
icon-color = "bg-base"
icon-bg-color = "accent"
label-color = "accent"
button-bg-color = "bg-base"

[modules.systray]
button-bg-color = "bg-base"

[modules.volume]
border-show = true
border-color = "yellow"
icon-bg-color = "yellow"
label-color = "yellow"
button-bg-color = "bg-base"

[modules.weather]
location = "Dijon"

[wallpaper]
engine-enabled = true
transition-type = "none"
cycling-interval-mins = 1440
cycling-same-image = true

[[wallpaper.monitors]]
name = "eDP-1"
wallpaper = "/home/paul/.config/hypr/wallpaper.png"
fit-mode = "fill"
