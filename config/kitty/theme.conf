# kitty : les @cle@ sont remplaces par la palette de theme.nix (theme.render).
# le texte sur les aplats (onglet actif, curseur, marques) prend base et pas
# crust : meme rendu sur les variants sombres, plus lisible sur un fond clair.

background            @base@
foreground            @text@

cursor                @accent@
cursor_text_color     @base@

selection_background  @surface1@
selection_foreground  @text@

url_color             @accent@

# les 16 couleurs ansi : 0..7 normales, 8..15 vives
color0   @ansi0@
color1   @ansi1@
color2   @ansi2@
color3   @ansi3@
color4   @ansi4@
color5   @ansi5@
color6   @ansi6@
color7   @ansi7@
color8   @ansi8@
color9   @ansi9@
color10  @ansi10@
color11  @ansi11@
color12  @ansi12@
color13  @ansi13@
color14  @ansi14@
color15  @ansi15@

# barre d'onglets
active_tab_foreground   @base@
active_tab_background   @accent@
inactive_tab_foreground @subtext0@
inactive_tab_background @crust@
tab_bar_background      @crust@

# marques
mark1_foreground @base@
mark1_background @yellow@
mark2_foreground @base@
mark2_background @red@
mark3_foreground @base@
mark3_background @green@
