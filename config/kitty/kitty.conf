# shell : fish explicite pour ne jamais heriter de SHELL=/bin/sh
shell /run/current-system/sw/bin/fish

# polices
font_family      JetBrainsMono Nerd Font Mono
font_size        12.0

# fenetre : meme transparence et flou que wezterm sous hyprland (0.92 + blur),
# barre de titre macos fondue dans la couleur de fond.
background_opacity         0.92
background_blur            20
dynamic_background_opacity yes
macos_titlebar_color       background
window_padding_width       12 16
enable_audio_bell          no

# coupe le clignotement du curseur au repos : evite les reveils gpu/compositeur
cursor_stop_blinking_after 15.0

# couleurs de theme.nix, rendues par hjem. chemin explicite depuis ~ : sinon un
# include relatif cherche a cote du symlink dans /nix/store.
include ~/.config/kitty/theme.conf
